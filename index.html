<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مُخطّطي</title>
<meta name="description" content="مخطط يومي: مهام بمواعيد، مواقيت الصلاة، ميزانية الشهر، وتقرير آخر اليوم.">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<meta name="theme-color" content="#0B7F7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="assets/fonts/ruqaa.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/readex-arabic.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=JSON.parse(localStorage.getItem('mk3d')||'{}').theme;if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M8 3v4M16 3v4M8 13l2.6 2.6L16 10"/></symbol>
  <symbol id="i-dash" viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3"/></symbol>
  <symbol id="i-prayer" viewBox="0 0 24 24"><path d="M12 3c-1.5 2.4-5 4-5 8a5 5 0 0 0 10 0c0-4-3.5-5.6-5-8zM5 21h14M9 21v-3M15 21v-3"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10h18M16 15h2"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.9 8.6 4.7 4.7 0 0 1 17.5 18z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<div id="app">
  <header class="top">
    <h1 class="brand">مُخطّطي</h1>
    <span class="pill" id="syncPill" data-s="local" hidden><i></i><span id="syncTxt"></span></span>
    <button class="iconbtn" id="themeBtn" aria-label="تبديل الوضع الداكن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><use href="#i-moon"/></svg></button>
  </header>

  <main id="main">
    <section class="view on" id="v-today" aria-label="اليوم"></section>
    <section class="view" id="v-dash" aria-label="لوحتي"></section>
    <section class="view" id="v-prayer" aria-label="الصلاة"></section>
    <section class="view" id="v-money" aria-label="الفلوس"></section>
    <section class="view" id="v-more" aria-label="المزيد"></section>
  </main>
</div>

<nav class="tabs" aria-label="التنقل">
  <div class="in-nav" role="tablist">
    <i class="blob" aria-hidden="true"></i>
    <button role="tab" data-tab="today" aria-selected="true"><svg><use href="#i-today"/></svg>اليوم</button>
    <button role="tab" data-tab="dash" aria-selected="false"><svg><use href="#i-dash"/></svg>لوحتي</button>
    <button role="tab" data-tab="prayer" aria-selected="false"><svg><use href="#i-prayer"/></svg>الصلاة</button>
    <button role="tab" data-tab="money" aria-selected="false"><svg><use href="#i-money"/></svg>الفلوس</button>
    <button role="tab" data-tab="more" aria-selected="false"><svg><use href="#i-more"/></svg>المزيد</button>
  </div>
</nav>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<dialog id="sys"><div class="modal" id="sysBody"></div></dialog>
<div id="toast" aria-live="polite"></div>
<div id="ob" class="ob" hidden></div>
<audio id="adhanEl" preload="none"></audio>

<noscript><p style="padding:24px;text-align:center">التطبيق محتاج JavaScript يشتغل.</p></noscript>
<script defer src="js/vendor/adhan.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
